<!doctype html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<title>舉球軌跡</title>
<style>
    :root {
        --bg: #0f1115;
        --surface: #171a21;
        --surface2: #1f2430;
        --ink: #e8eaf0;
        --muted: #9aa3b2;
        --line: #2b3140;
        --accent: #c4485a;
        --on-accent: #ffffff;
        --good: #22c55e;
        --ok: #eab308;
        --bad: #ef4444;
        --warn-bg: #4a3b10;
        --warn-ink: #ffe28a;
        --font-ui: system-ui, -apple-system, "PingFang TC", "Noto Sans TC", "Microsoft JhengHei", sans-serif;
        --font-num: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
        color-scheme: dark;
    }
    *, *::before, *::after { box-sizing: border-box; }
    [hidden] { display: none !important; }
    html, body { margin: 0; background: var(--bg); color: var(--ink); font: 14px/1.45 var(--font-ui); }
    body { min-height: 100vh; -webkit-text-size-adjust: 100%; }
    button, input, select, textarea { font: inherit; color: inherit; }
    button {
        background: var(--surface2); border: 1px solid var(--line); border-radius: 8px;
        padding: 6px 10px; cursor: pointer; min-height: 34px; white-space: nowrap;
    }
    button:hover { border-color: #3d4558; }
    button:disabled { opacity: .45; cursor: default; }
    button.primary { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
    button.on { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
    button.danger { color: #ffb4b4; border-color: #6b2a2a; }
    button.small { min-height: 28px; padding: 3px 8px; font-size: 13px; }
    input[type=number], input[type=text], select, textarea {
        background: var(--surface2); border: 1px solid var(--line); border-radius: 8px; padding: 6px 8px; min-height: 34px;
    }
    textarea { width: 100%; min-height: 54px; resize: vertical; }
    .muted { color: var(--muted); }
    .num { font-family: var(--font-num); font-variant-numeric: tabular-nums; }
    .row { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
    .grow { flex: 1; }

    header.top {
        display: flex; gap: 8px; align-items: center; flex-wrap: wrap;
        padding: 8px 12px; border-bottom: 1px solid var(--line); background: var(--surface);
        position: sticky; top: 0; z-index: 20;
    }
    .brand { font-weight: 700; letter-spacing: .5px; margin-right: 6px; }
    .brand small { font-weight: 400; color: var(--muted); margin-left: 6px; }
    .menu { position: relative; }
    .menu-pop {
        position: absolute; top: calc(100% + 4px); left: 0; z-index: 30; min-width: 220px;
        background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 6px;
        display: flex; flex-direction: column; gap: 4px; box-shadow: 0 8px 24px rgba(0,0,0,.5);
    }
    .menu-pop button { text-align: left; border: 0; background: transparent; }
    .menu-pop button:hover { background: var(--surface2); }
    #videoName { max-width: 260px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

    main.layout { display: grid; grid-template-columns: minmax(0, 1fr) 400px; gap: 12px; padding: 12px; align-items: start; }
    @media (max-width: 900px) { main.layout { grid-template-columns: minmax(0, 1fr); padding: 8px; } }
    .stage { min-width: 0; }
    @media (min-width: 901px) { .stage { position: sticky; top: 60px; } }
    .stage-row { display: flex; gap: 10px; align-items: flex-start; justify-content: center; flex-wrap: wrap; }
    .video-box { position: relative; background: #000; border-radius: 8px; overflow: hidden; touch-action: none; user-select: none; -webkit-user-select: none; }
    .video-box video, .video-box canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
    .video-box .empty {
        position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center;
        gap: 10px; padding: 16px; text-align: center; color: var(--muted);
    }
    .view3d-box { display: flex; flex-direction: column; gap: 6px; }
    .view3d-box canvas { display: block; background: #0b0e14; border-radius: 8px; touch-action: none; }
    .view3d-tools { display: flex; gap: 4px; flex-wrap: wrap; }
    .transport { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; margin-top: 8px; }
    .transport .time { margin-left: auto; font-family: var(--font-num); }
    #timeline { width: 100%; margin: 8px 0 0; accent-color: var(--accent); }

    .panel { min-width: 0; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; }
    .tabs { display: flex; border-bottom: 1px solid var(--line); }
    .tabs button { flex: 1; border: 0; border-radius: 0; background: transparent; padding: 10px 4px; min-height: 42px; border-bottom: 2px solid transparent; }
    .tabs button.on { color: var(--ink); border-bottom-color: var(--accent); background: transparent; }
    .tab { padding: 12px; display: flex; flex-direction: column; gap: 12px; }
    .tab h3 { margin: 0; font-size: 14px; color: var(--muted); font-weight: 600; }
    .hint { color: var(--muted); font-size: 13px; margin: 0; }
    .warn { background: var(--warn-bg); color: var(--warn-ink); border-radius: 8px; padding: 8px 10px; font-size: 13px; }
    .chips { display: flex; flex-wrap: wrap; gap: 6px; }
    .chip { min-height: 30px; padding: 3px 9px; border-radius: 999px; font-size: 13px; }
    .chip .ck { color: var(--good); margin-left: 4px; }
    .chip.on .ck { color: #fff; }
    .card { background: var(--surface2); border: 1px solid var(--line); border-radius: 10px; padding: 10px; display: flex; flex-direction: column; gap: 8px; }
    .court-svg { width: 100%; max-width: 260px; display: block; margin: 0 auto; }
    .court-svg .hit { cursor: pointer; }
    .kv { display: grid; grid-template-columns: auto 1fr; gap: 2px 10px; font-size: 13px; }
    .kv dt { color: var(--muted); }
    .kv dd { margin: 0; font-family: var(--font-num); }

    .list { display: flex; flex-direction: column; gap: 6px; }
    .item { background: var(--surface2); border: 1px solid var(--line); border-radius: 10px; padding: 8px 10px; display: flex; flex-direction: column; gap: 6px; cursor: pointer; }
    .item.sel { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent) inset; }
    .item .head { display: flex; gap: 8px; align-items: baseline; flex-wrap: wrap; }
    .item .no { font-weight: 700; }
    .dot { display: inline-block; width: 10px; height: 10px; border-radius: 50%; vertical-align: middle; }
    .tag { font-size: 12px; padding: 1px 7px; border-radius: 999px; background: #2a3040; color: var(--ink); }
    .tag.them { background: #3a2a2a; }
    .grade button { min-height: 28px; padding: 2px 9px; font-size: 13px; }
    .grade button.g-good.on { background: var(--good); border-color: var(--good); color: #062b14; }
    .grade button.g-ok.on { background: var(--ok); border-color: var(--ok); color: #2b2205; }
    .grade button.g-bad.on { background: var(--bad); border-color: var(--bad); color: #fff; }
    table.stats { width: 100%; border-collapse: collapse; font-size: 13px; }
    table.stats th, table.stats td { padding: 4px 6px; border-bottom: 1px solid var(--line); text-align: right; }
    table.stats th:first-child, table.stats td:first-child { text-align: left; }
    table.stats th { color: var(--muted); font-weight: 600; }

    .sheet { position: fixed; inset: 0; background: rgba(0,0,0,.6); z-index: 50; display: flex; align-items: center; justify-content: center; padding: 16px; }
    .sheet .box { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 16px; width: min(460px, 100%); max-height: calc(100vh - 32px); overflow: auto; display: flex; flex-direction: column; gap: 12px; }
    .sheet h2 { margin: 0; font-size: 16px; }
    .field { display: flex; flex-direction: column; gap: 4px; }
    .field label { font-weight: 600; }
    .toast { position: fixed; left: 50%; bottom: 20px; transform: translateX(-50%); background: #2a3142; color: var(--ink); border: 1px solid var(--line); border-radius: 10px; padding: 10px 14px; z-index: 60; max-width: calc(100vw - 32px); box-shadow: 0 8px 24px rgba(0,0,0,.5); }
    kbd { font-family: var(--font-num); font-size: 12px; border: 1px solid var(--line); border-bottom-width: 2px; border-radius: 4px; padding: 0 4px; background: var(--surface2); }
</style>
</head>
<body>
<header class="top">
    <div class="brand">舉球軌跡<small>setter-track</small></div>
    <button id="btnOpenVideo" class="primary">開啟影片</button>
    <span id="videoName" class="muted"></span>
    <div class="menu">
        <button id="btnProject">專案 ▾</button>
        <div class="menu-pop" id="menuProject" hidden>
            <button data-act="openProject">開啟專案檔…</button>
            <button data-act="saveProject">下載專案檔</button>
            <button data-act="importDet">匯入自動偵測結果…</button>
            <button data-act="exportLabels">匯出訓練標註</button>
            <button data-act="clearProject">清空這支影片的資料…</button>
        </div>
    </div>
    <button id="btnSettings">設定</button>
    <span id="saveState" class="muted"></span>
    <input type="file" id="fileVideo" accept="video/*" hidden>
    <input type="file" id="fileJson" accept=".json,application/json" hidden>
</header>
<main class="layout">
    <section class="stage" id="stage">
        <div class="stage-row">
            <div class="video-box" id="videoBox">
                <video id="video" playsinline muted preload="auto"></video>
                <canvas id="overlay"></canvas>
                <div class="empty" id="emptyHint">
                    <div>開啟一支練球或比賽的影片（影片只在這台裝置上讀，不會上傳）</div>
                    <button class="primary" data-act="openVideo">開啟影片</button>
                    <div class="hint">建議：腳架固定、60fps、整場不改倍率；用 0.5x／0.7x 時記得在「場地校正」勾「廣角鏡頭」。</div>
                </div>
            </div>
            <div class="view3d-box" id="view3dBox" hidden>
                <div class="view3d-tools" id="view3dTools"></div>
                <canvas id="view3d"></canvas>
            </div>
        </div>
        <div class="transport">
            <button data-seek="-1" title="Shift＋←">−1 秒</button>
            <button data-step="-1" title="←">◀ 1 格</button>
            <button id="btnPlay" title="空白鍵">▶ 播放</button>
            <button data-step="1" title="→">1 格 ▶</button>
            <button data-seek="1" title="Shift＋→">+1 秒</button>
            <span class="row">
                <button class="small" data-rate="0.25">0.25×</button>
                <button class="small" data-rate="0.5">0.5×</button>
                <button class="small on" data-rate="1">1×</button>
            </span>
            <span class="time" id="timeLabel">00:00.00</span>
        </div>
        <input type="range" id="timeline" min="0" max="1000" value="0" step="1" aria-label="時間軸">
    </section>
    <aside class="panel">
        <nav class="tabs">
            <button data-tab="calib" class="on">① 場地校正</button>
            <button data-tab="mark">② 標記舉球</button>
            <button data-tab="view">③ 檢視</button>
        </nav>
        <div class="tab" id="tabBody"></div>
    </aside>
</main>
<div class="sheet" id="sheet" hidden><div class="box" id="sheetBox"></div></div>
<div class="toast" id="toast" hidden></div>
<script>
/* @core-begin */
// ============================================================
// CONFIG
// ============================================================
const CONFIG = {
    SCHEMA: 1,
    APP: 'setter-track',
    G: 9.81,
    HALF_W: 4.5,
    HALF_L: 9,
    ATTACK: 3,
    NET_HEIGHT_DEFAULT: 2.43,
    ANTENNA_ABOVE: 0.8,
    NET_DEPTH: 1.0,
    BALL_R: 0.105,
    ZONE_SPLIT: 1.5,
    BACKROW_DIST: 3,
    MIN_MARKS: 4,
    GRADES: {
        good: { label: '好', color: '#22c55e' },
        ok: { label: '普通', color: '#eab308' },
        bad: { label: '待改進', color: '#ef4444' },
    },
    NO_GRADE_COLOR: '#94a3b8',
    TARGETS: ['大砲', '欄中', '背', '後排'],
};

const AX = { x: 0, y: 1, z: 2 };

function landmarkDefs(netH) {
    const W = CONFIG.HALF_W, L = CONFIG.HALF_L, A = CONFIG.ATTACK, aH = netH + CONFIG.ANTENNA_ABOVE;
    return [
        { id: 'nearBackL', label: '近端底線・左角', X: [-W, -L, 0] },
        { id: 'nearBackR', label: '近端底線・右角', X: [W, -L, 0] },
        { id: 'nearAtkL', label: '近端進攻線・左端', X: [-W, -A, 0] },
        { id: 'nearAtkR', label: '近端進攻線・右端', X: [W, -A, 0] },
        { id: 'midL', label: '中線・左端', X: [-W, 0, 0] },
        { id: 'midR', label: '中線・右端', X: [W, 0, 0] },
        { id: 'farAtkL', label: '遠端進攻線・左端', X: [-W, A, 0] },
        { id: 'farAtkR', label: '遠端進攻線・右端', X: [W, A, 0] },
        { id: 'farBackL', label: '遠端底線・左角', X: [-W, L, 0] },
        { id: 'farBackR', label: '遠端底線・右角', X: [W, L, 0] },
        { id: 'netTopL', label: '網子上緣・左標誌桿', X: [-W, 0, netH] },
        { id: 'netTopR', label: '網子上緣・右標誌桿', X: [W, 0, netH] },
        { id: 'antTopL', label: '左標誌桿頂端', X: [-W, 0, aH] },
        { id: 'antTopR', label: '右標誌桿頂端', X: [W, 0, aH] },
    ];
}

function lineDefs(netH) {
    const W = CONFIG.HALF_W, L = CONFIG.HALF_L, A = CONFIG.ATTACK, aH = netH + CONFIG.ANTENNA_ABOVE;
    return [
        { id: 'sideL', label: '左邊線', fixed: { x: -W, z: 0 }, free: 'y', range: [-L, L] },
        { id: 'sideR', label: '右邊線', fixed: { x: W, z: 0 }, free: 'y', range: [-L, L] },
        { id: 'nearBack', label: '近端底線', fixed: { y: -L, z: 0 }, free: 'x', range: [-W, W] },
        { id: 'nearAtk', label: '近端進攻線', fixed: { y: -A, z: 0 }, free: 'x', range: [-W, W] },
        { id: 'mid', label: '中線', fixed: { y: 0, z: 0 }, free: 'x', range: [-W, W] },
        { id: 'farAtk', label: '遠端進攻線', fixed: { y: A, z: 0 }, free: 'x', range: [-W, W] },
        { id: 'farBack', label: '遠端底線', fixed: { y: L, z: 0 }, free: 'x', range: [-W, W] },
        { id: 'netTop', label: '網子上緣', fixed: { y: 0, z: netH }, free: 'x', range: [-W, W] },
        { id: 'antL', label: '左標誌桿', fixed: { x: -W, y: 0 }, free: 'z', range: [netH - CONFIG.NET_DEPTH, aH] },
        { id: 'antR', label: '右標誌桿', fixed: { x: W, y: 0 }, free: 'z', range: [netH - CONFIG.NET_DEPTH, aH] },
    ];
}

// 畫球場用的 3D 線段（世界座標）
function courtSegments(netH) {
    const W = CONFIG.HALF_W, L = CONFIG.HALF_L, A = CONFIG.ATTACK, aH = netH + CONFIG.ANTENNA_ABOVE, nb = netH - CONFIG.NET_DEPTH;
    return {
        floor: [
            [[-W, -L, 0], [W, -L, 0]], [[W, -L, 0], [W, L, 0]], [[W, L, 0], [-W, L, 0]], [[-W, L, 0], [-W, -L, 0]],
            [[-W, 0, 0], [W, 0, 0]], [[-W, -A, 0], [W, -A, 0]], [[-W, A, 0], [W, A, 0]],
        ],
        net: [[[-W, 0, netH], [W, 0, netH]], [[-W, 0, nb], [W, 0, nb]], [[-W, 0, nb], [-W, 0, netH]], [[W, 0, nb], [W, 0, netH]]],
        posts: [[[-W - 0.5, 0, 0], [-W - 0.5, 0, netH + 0.1]], [[W + 0.5, 0, 0], [W + 0.5, 0, netH + 0.1]]],
        antennas: [[[-W, 0, nb], [-W, 0, aH]], [[W, 0, nb], [W, 0, aH]]],
    };
}

// ============================================================
// 小工具與線性代數
// ============================================================
function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}
function uid(prefix) {
    return (prefix || '') + Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
}
const dot3 = (a, b) => a[0] * b[0] + a[1] * b[1] + a[2] * b[2];
const sub3 = (a, b) => [a[0] - b[0], a[1] - b[1], a[2] - b[2]];
const add3 = (a, b) => [a[0] + b[0], a[1] + b[1], a[2] + b[2]];
const scale3 = (a, s) => [a[0] * s, a[1] * s, a[2] * s];
const cross3 = (a, b) => [a[1] * b[2] - a[2] * b[1], a[2] * b[0] - a[0] * b[2], a[0] * b[1] - a[1] * b[0]];
const norm3 = a => Math.sqrt(dot3(a, a));
const normalize3 = a => { const n = norm3(a) || 1; return [a[0] / n, a[1] / n, a[2] / n]; };
function mat3mul(A, B) {
    const C = new Array(9);
    for (let i = 0; i < 3; i++) for (let j = 0; j < 3; j++) {
        C[i * 3 + j] = A[i * 3] * B[j] + A[i * 3 + 1] * B[3 + j] + A[i * 3 + 2] * B[6 + j];
    }
    return C;
}
const mat3vec = (A, v) => [A[0] * v[0] + A[1] * v[1] + A[2] * v[2], A[3] * v[0] + A[4] * v[1] + A[5] * v[2], A[6] * v[0] + A[7] * v[1] + A[8] * v[2]];
const mat3T = A => [A[0], A[3], A[6], A[1], A[4], A[7], A[2], A[5], A[8]];
function mat3det(A) {
    return A[0] * (A[4] * A[8] - A[5] * A[7]) - A[1] * (A[3] * A[8] - A[5] * A[6]) + A[2] * (A[3] * A[7] - A[4] * A[6]);
}
function mat3inv(A) {
    const d = mat3det(A);
    if (Math.abs(d) < 1e-15) return null;
    const i = 1 / d;
    return [
        (A[4] * A[8] - A[5] * A[7]) * i, (A[2] * A[7] - A[1] * A[8]) * i, (A[1] * A[5] - A[2] * A[4]) * i,
        (A[5] * A[6] - A[3] * A[8]) * i, (A[0] * A[8] - A[2] * A[6]) * i, (A[2] * A[3] - A[0] * A[5]) * i,
        (A[3] * A[7] - A[4] * A[6]) * i, (A[1] * A[6] - A[0] * A[7]) * i, (A[0] * A[4] - A[1] * A[3]) * i,
    ];
}
// 高斯消去（部分選主元）。A: n×n 陣列的陣列；b: 長度 n。失敗回傳 null。
function solveLinear(A, b) {
    const n = b.length;
    const M = A.map((row, i) => row.slice().concat([b[i]]));
    for (let c = 0; c < n; c++) {
        let p = c;
        for (let r = c + 1; r < n; r++) if (Math.abs(M[r][c]) > Math.abs(M[p][c])) p = r;
        if (Math.abs(M[p][c]) < 1e-14) return null;
        if (p !== c) { const tmp = M[p]; M[p] = M[c]; M[c] = tmp; }
        for (let r = c + 1; r < n; r++) {
            const k = M[r][c] / M[c][c];
            if (k === 0) continue;
            for (let j = c; j <= n; j++) M[r][j] -= k * M[c][j];
        }
    }
    const x = new Array(n);
    for (let r = n - 1; r >= 0; r--) {
        let s = M[r][n];
        for (let j = r + 1; j < n; j++) s -= M[r][j] * x[j];
        x[r] = s / M[r][r];
    }
    return x.every(Number.isFinite) ? x : null;
}
// 最小平方：rows = [[a…], …]，rhs = [b…]
function leastSquares(rows, rhs) {
    const m = rows[0].length;
    const A = Array.from({ length: m }, () => new Array(m).fill(0));
    const g = new Array(m).fill(0);
    for (let i = 0; i < rows.length; i++) {
        const r = rows[i];
        for (let a = 0; a < m; a++) {
            g[a] += r[a] * rhs[i];
            for (let b = a; b < m; b++) A[a][b] += r[a] * r[b];
        }
    }
    for (let a = 0; a < m; a++) for (let b = 0; b < a; b++) A[a][b] = A[b][a];
    return solveLinear(A, g);
}
function rodrigues(w) {
    const th = Math.sqrt(w[0] * w[0] + w[1] * w[1] + w[2] * w[2]);
    if (th < 1e-12) return [1, -w[2], w[1], w[2], 1, -w[0], -w[1], w[0], 1];
    const k = [w[0] / th, w[1] / th, w[2] / th], c = Math.cos(th), s = Math.sin(th), v = 1 - c;

    else target = '欄中';

    return {
        side, team: side === ourSide ? 'us' : 'them',
        start: s, end: e, startA: sA, endA: eA,
        apexZ, apexT, aboveNet: apexZ - netH,
        flight: tE - tS, target, dir: eA[0] < sA[0] ? 'to4' : 'to2',

    if (mt.startDistNet > 3.5 || mt.startDistNet < -0.3) why.push('起點離網太遠');

function newProject(video) {

function calibInputFromProject(p) {

function deriveSet(p, s) {

function summarize(derived) {

// 偵測結果（Python → 網頁，規格 7.1）：每條是連續追到的球軌跡，還沒切段
function parseDetections(obj) {

// 把一條連續的球軌跡切成一段段拋物線（球被碰到的地方會折斷）。
// 用相機模型算真正的重投影誤差，所以透視、廣角變形都不影響。pts 要依時間排序，t 是實際秒。
function splitBallistic(cam, pts, opts) {
    const o = Object.assign({ tol: 3, minLen: 6 }, opts || {});
    const n = pts.length, segs = [];
    const errAt = (fit, k) => {
        const X = ballAt(fit, pts[k].t);
        if (camCoords(cam, X)[2] <= 1e-3) return 1e9;
        const q = projectRaw(cam, X);
        return Math.hypot(q[0] - pts[k].u, q[1] - pts[k].v);
    };
    const lin = idx => {
        const t0 = pts[idx[0]].t, p = fitBallisticLinear(cam, idx.map(k => pts[k]), t0);
        return p ? { t0, p0: p.slice(0, 3), v0: p.slice(3) } : null;
    };
    const good = (fit, idx) => fit && idx.every(k => errAt(fit, k) <= o.tol);
    let i = 0;
    while (i + o.minLen <= n) {
        const idx = [];
        for (let k = i; k < i + o.minLen; k++) idx.push(k);
        let fit = lin(idx);
        if (!good(fit, idx)) { i++; continue; }
        let j = i + o.minLen;
        while (j < n) {
            if (errAt(fit, j) <= o.tol) { idx.push(j); j++; if (idx.length % 3 === 0) fit = lin(idx) || fit; continue; }
            const withJ = idx.concat([j]), fj = lin(withJ);
            if (good(fj, withJ)) { fit = fj; idx.push(j); j++; continue; }
            // 只是一個雜點？跳過它，後面兩點還接得上就繼續
            if (j + 2 < n) {
                const skip = idx.concat([j + 1, j + 2]), fs = lin(skip);
                if (good(fs, skip)) { fit = fs; idx.push(j + 1, j + 2); j += 3; continue; }
            }

// 匯入的軌跡 → 切段 → 擬合 → 判斷像不像舉球。已經是舉球（或被略過）的時間段不再列出。
function deriveCandidates(p) {
    const cam = p.calib.cam, k = p.video.realPerVideo || 1;
    if (!cam) return { ready: false, list: [] };
    const tol = Math.max(2.5, 0.0025 * (p.video.w || cam.w || 1280));
    const taken = deriveAll(p).filter(d => d.fit).map(d => [d.fit.tStart / k, d.fit.tEnd / k]);
    const segs = [];
    for (const c of p.candidates) {
        const pts = c.points.map(m => ({ t: m.t * k, u: m.u, v: m.v, tv: m.t }));
        for (const seg of splitBallistic(cam, pts, { tol })) segs.push({ cand: c, pts: seg });
    }
    // 偵測漏了幾格、軌跡斷成兩條時，後半截會從半空中開始，很像一顆舉球。
    // 前一段結束後 0.3 秒內開始、兩段合起來還是同一條拋物線 → 接回去（真的被碰到的話接不起來）。
    segs.sort((a, b) => a.pts[0].t - b.pts[0].t);
    const merged = [];
    for (const sg of segs) {
        let joined = false;
        for (let i = merged.length - 1; i >= 0 && i >= merged.length - 8 && !joined; i--) {
            const r = merged[i], gap = sg.pts[0].t - r.pts[r.pts.length - 1].t;
            if (gap <= 0 || gap > 0.3) continue;
            const all = r.pts.concat(sg.pts), f = fitBallistic(cam, all);
            if (f && f.rms <= tol && f.inliers.filter(x => !x).length <= Math.max(1, all.length * 0.1)) { merged[i] = { cand: r.cand, pts: all }; joined = true; }
        }
        if (!joined) merged.push(sg);
    }
    const list = [];
    for (const { cand: c, pts: seg } of merged) {
        {
            const tv0 = seg[0].tv, tv1 = seg[seg.length - 1].tv, mid = 0.5 * (tv0 + tv1);
            if ((c.dismissed || []).some(r => mid >= r[0] && mid <= r[1])) continue;
            if (taken.some(r => mid >= r[0] && mid <= r[1])) continue;
            const fit = fitBallistic(cam, seg);
            if (!fit) continue;
            const metrics = setMetrics(fit, p.settings), like = looksLikeSet(metrics);
            if (fit.rms > tol) { like.ok = false; like.why.push('不像一條拋物線'); }
            list.push({ key: `${c.id}@${tv0.toFixed(3)}`, cand: c, points: seg.map(m => ({ t: m.tv, u: m.u, v: m.v })), fit, metrics, like, tVideo: tv0, tVideoEnd: tv1 });
        }
    }
    list.sort((a, b) => a.tVideo - b.tVideo);
    return { ready: true, list };
}

function buildLabels(p) {
    const cam = p.calib.cam, k = p.video.realPerVideo || 1, labels = [];
    if (!cam) return { app: 'setter-track-labels', version: 1, video: { name: p.video.name, w: p.video.w, h: p.video.h }, labels };
    for (const d of deriveAll(p)) {

// SELFTEST（node tests/selftest.mjs，或瀏覽器主控台 runSelfTests()）
// ============================================================
function runSelfTests() {
    const results = [];
    const T = (name, fn) => {
        try { fn(); results.push({ name, ok: true }); }
        catch (e) { results.push({ name, ok: false, error: String(e && e.message || e) }); }
    };
    const ok = (c, msg) => { if (!c) throw new Error(msg || '不成立'); };
    const near = (a, b, tol, msg) => { if (!(Math.abs(a - b) <= tol)) throw new Error(`${msg || ''} 預期 ${b}±${tol}，實際 ${a}`); };
    const dist = (a, b) => norm3(sub3(a, b));
    let seed = 20261104;
    const rnd = () => { seed = (seed * 1103515245 + 12345) % 2147483648; return seed / 2147483648; };
    const gauss = () => { const u = Math.max(rnd(), 1e-12), v = rnd(); return Math.sqrt(-2 * Math.log(u)) * Math.cos(2 * Math.PI * v); };
    const W = 1920, H = 1080, netH = 2.43;
    const mkCam = (C, target, fFrac, k1, k2) => { const c = lookAtCamera(C, target, fFrac * W, W, H); c.k1 = k1 || 0; c.k2 = k2 || 0; return c; };
    const inImage = q => q && q[0] >= 0 && q[0] < W && q[1] >= 0 && q[1] < H;
    const synthCalib = (cam, noise, withLines, wide) => {
        const points = [], lines = [];
        for (const d of landmarkDefs(netH)) {
            const q = projectPoint(cam, d.X);
            if (inImage(q)) points.push({ id: d.id, X: d.X, u: q[0] + noise * gauss(), v: q[1] + noise * gauss() });
        }
        if (withLines) for (const d of lineDefs(netH)) for (let i = 1; i < 10; i++) {
            const X = [0, 0, 0];
            for (const [k, v] of Object.entries(d.fixed)) X[AX[k]] = v;
            X[AX[d.free]] = d.range[0] + (d.range[1] - d.range[0]) * i / 10;
            const q = projectPoint(cam, X);
            if (inImage(q)) lines.push({ line: d, u: q[0] + noise * gauss(), v: q[1] + noise * gauss() });
        }
        return { w: W, h: H, wide: wide != null ? wide : !!(cam.k1 || cam.k2), points, lines };
    };
    // 真實舉球：起點 s、終點 e、飛行 T 秒
    const trueFit = (s, e, dur) => {
        const v0 = [(e[0] - s[0]) / dur, (e[1] - s[1]) / dur, (e[2] - s[2]) / dur + 0.5 * CONFIG.G * dur];
        return { t0: 0, p0: s, v0, tStart: 0, tEnd: dur };
    };
    const observe = (cam, fit, noise, fps, step) => {
        const obs = [];
        for (let t = 0; t <= fit.tEnd + 1e-9; t += step / fps) {
            const q = projectPoint(cam, ballAt(fit, t));
            if (q) obs.push({ t, u: q[0] + noise * gauss(), v: q[1] + noise * gauss() });
        }
        return obs;
    };
    // 示範影片那種角度：近端底線後方的角落，0.7x 廣角
    const wideCam = mkCam([-7, -13, 3.2], [0, -1, 1.2], 0.55, -0.12, 0.02);
    const plainCam = mkCam([0.5, -14, 3.5], [0, 0, 1], 0.8, 0, 0);
    const setTo4 = trueFit([0.5, -0.7, 2.5], [-3.6, -0.9, 3.0], 1.15);

    T('旋轉矩陣是正交的', () => {
        const R = rodrigues([0.3, -1.2, 2.0]);
        const I = mat3mul(R, mat3T(R));
        for (let i = 0; i < 9; i++) near(I[i], i % 4 === 0 ? 1 : 0, 1e-12, `RRᵀ[${i}]`);
        near(mat3det(R), 1, 1e-12, 'det');
        const Rn = orthonormalize(R.map(v => v * 1.01 + 0.002));
        near(mat3det(Rn), 1, 1e-9, '修正後 det');
    });

    T('廣角變形：投影再反變形回到原點', () => {
        const cam = { f: 1000, cx: 960, cy: 540, k1: -0.2, k2: 0.04, R: [1, 0, 0, 0, 1, 0, 0, 0, 1], t: [0, 0, 0] };
        for (let i = 1; i <= 20; i++) {
            const a = i * 0.7, r = i * 0.045, x = r * Math.cos(a), y = r * Math.sin(a);
            const q = projectRaw(cam, [x, y, 1]);
            const n = undistortPixel(cam, q[0], q[1]);

        }
    });

    T('平面轉換：4 點以上精確對應', () => {
        const src = [[-4.5, -9], [4.5, -9], [4.5, 9], [-4.5, 9], [0, 0]];
        const dst = src.map(([x, y]) => projectRaw(plainCam, [x, y, 0]));
        const Hm = homography(src, dst);
        for (let i = 0; i < src.length; i++) {
            const q = applyH(Hm, src[i][0], src[i][1]);
            near(q[0], dst[i][0], 1e-6, 'u'); near(q[1], dst[i][1], 1e-6, 'v');
        }
        const f = focalFromH(Hm, W / 2, H / 2);
        near(f, plainCam.f, plainCam.f * 0.01, '由平面轉換估的焦距');
    });

    T('校正：一般鏡頭', () => {
        const r = calibrate(synthCalib(plainCam, 0.5, false, false));
        ok(r.ok, r.msg);
        near(r.cam.f, plainCam.f, plainCam.f * 0.02, '焦距');
        ok(dist(r.center, camCenter(plainCam)) < 0.15, `相機位置誤差 ${dist(r.center, camCenter(plainCam)).toFixed(3)} m`);
        ok(r.rms < 1, `RMS ${r.rms}`);
        ok(r.hasHeight, '有網子的點');
    });

    T('校正：0.7x 廣角要勾「廣角鏡頭」才準', () => {
        const input = synthCalib(wideCam, 0.5, true, true);
        ok(input.points.length >= 8, `看得到的已知點太少：${input.points.length}`);
        const r = calibrate(input);
        ok(r.ok, r.msg);
        ok(r.rms < 1.2, `RMS ${r.rms}`);
        near(r.cam.f, wideCam.f, wideCam.f * 0.04, '焦距');
        ok(dist(r.center, camCenter(wideCam)) < 0.25, `相機位置誤差 ${dist(r.center, camCenter(wideCam)).toFixed(3)} m`);
        const r2 = calibrate(Object.assign({}, input, { wide: false }));
        ok(r2.ok && r2.rms > 3 * r.rms, `沒勾廣角時誤差應該明顯變大：${r2.rms} vs ${r.rms}`);
    });

    T('校正：4 個地板點＋直線上的點也算得出', () => {
        const full = synthCalib(wideCam, 0.5, true, true);
        const keep = ['midL', 'midR', 'farBackL', 'farBackR', 'netTopL', 'netTopR'];
        const input = Object.assign({}, full, { points: full.points.filter(p => keep.includes(p.id)) });
        ok(input.points.filter(p => p.X[2] === 0).length >= 4, '測試資料要有 4 個地板點');
        const r = calibrate(input);
        ok(r.ok, r.msg);
        ok(r.rms < 1.5, `RMS ${r.rms}`);
        ok(dist(r.center, camCenter(wideCam)) < 0.4, `相機位置誤差 ${dist(r.center, camCenter(wideCam)).toFixed(3)} m`);
    });

    T('校正：地板點不夠時給清楚的訊息', () => {
        const input = synthCalib(plainCam, 0, false, false);
        input.points = input.points.filter(p => p.X[2] === 0).slice(0, 3);
        const r = calibrate(input);
        ok(!r.ok && /4 個地板/.test(r.msg), r.msg);
    });

    T('擬合：往 4 號位的高球（廣角、1 px 雜訊）', () => {
        const cal = calibrate(synthCalib(wideCam, 0.5, true, true));
        ok(cal.ok, cal.msg);

        ok(obs.length >= 15, `觀測點 ${obs.length}`);
        const fit = fitBallistic(cal.cam, obs);

function strokePath(ctx, pts, maxJump) {
    let started = false, prev = null;
    ctx.beginPath();
    for (const q of pts) {
        if (!q || !Number.isFinite(q[0]) || !Number.isFinite(q[1])) { started = false; prev = null; continue; }
        if (started && maxJump && Math.hypot(q[0] - prev[0], q[1] - prev[1]) > maxJump) started = false;
        if (!started) { ctx.moveTo(q[0], q[1]); started = true; } else ctx.lineTo(q[0], q[1]);
        prev = q;
    }
    ctx.stroke();
}
function sampleSeg(a, b, n) {
    const out = [];
    for (let i = 0; i <= n; i++) out.push([a[0] + (b[0] - a[0]) * i / n, a[1] + (b[1] - a[1]) * i / n, a[2] + (b[2] - a[2]) * i / n]);
    return out;
}

    }

function makeView(mode, W, H) {
    if (mode === 'video' && S.project.calib.cam) {
        const cam = S.project.calib.cam, s = W / cam.w;
        return { proj: X => { const q = projectPoint(cam, X); return q ? [q[0] * s, q[1] * s] : null; }, persp: true, bgVideo: true, scale: s };
    }
    if (mode === 'side') { // 從右邊線看：橫軸 = 離網距離，近端在左
        const s = Math.min(W / 13, H / 7.2);
        return { proj: X => [W / 2 + X[1] * s, H - 0.08 * H - X[2] * s], persp: false, ortho: 'side' };
    }
    if (mode === 'front') { // 從近端底線後面看：橫軸 = 沿著球網的位置
        const s = Math.min(W / 11.5, H / 7.2);
        return { proj: X => [W / 2 + X[0] * s, H - 0.08 * H - X[2] * s], persp: false, ortho: 'front' };
    }
    if (mode === 'top') {
        const s = Math.min(W / 21, H / 11);
        return { proj: X => [W / 2 + X[1] * s, H / 2 + X[0] * s], persp: false };
    }
    const v = S.view, az = v.az * Math.PI / 180, el = v.el * Math.PI / 180;
    const target = [0, -1, 2.2];
    const C = [target[0] + v.dist * Math.cos(el) * Math.cos(az), target[1] + v.dist * Math.cos(el) * Math.sin(az), target[2] + v.dist * Math.sin(el)];
    const cam = lookAtCamera(C, target, 1.05 * W, W, H);
    return { proj: X => projectPoint(cam, X), persp: true };
}
function draw3D() {
    if (view3dBox.hidden) return;
    const ctx = view3d.getContext('2d');
    const W = view3d.width, H = view3d.height;
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.fillStyle = '#0b0e14'; ctx.fillRect(0, 0, W, H);
    const mode = S.view.mode === 'video' && !S.project.calib.cam ? 'behind' : S.view.mode;
    const vw = makeView(mode, W, H), proj = vw.proj, lw = DPR();
    if (vw.bgVideo && S.ready) { try { ctx.globalAlpha = 0.55; ctx.drawImage(video, 0, 0, W, H); ctx.globalAlpha = 1; } catch (e) { /* 沒畫面 */ } }
    if (!vw.bgVideo) {
        const c = [[-4.5, -9, 0], [4.5, -9, 0], [4.5, 9, 0], [-4.5, 9, 0]].map(proj);
        if (c.every(Boolean) && !vw.ortho) {
            ctx.fillStyle = 'rgba(201,161,107,.28)';
            ctx.beginPath(); c.forEach((q, i) => (i ? ctx.lineTo(q[0], q[1]) : ctx.moveTo(q[0], q[1]))); ctx.closePath(); ctx.fill();
        }

    }

    const ds = visibleDerived();
    const sorted = ds.filter(d => d.set.id !== S.selId).concat(ds.filter(d => d.set.id === S.selId));
    for (const d of sorted) {
        const sel = d.set.id === S.selId;
        if (!S.view.all && !sel) continue;
        drawArc(ctx, proj, d, lw, { sel, dim: S.selId && !sel, shadow: vw.persp && !vw.bgVideo, label: S.view.labels ? setNumber(d.set.id) : null, maxJump: W * 0.6 });
    }

        ctx.fillText(S.project.calib.cam ? '還沒有舉球軌跡：到「② 標記舉球」新增' : '先完成「① 場地校正」', W / 2, H / 2);

}
// 正面／側面的刻度：每 1 m 一條高度線、地板、進攻線或分區線
function drawOrthoGuides(ctx, proj, lw, kind, W) {
    const font = `${12 * lw}px ${getComputedStyle(document.body).fontFamily}`;
    ctx.font = font; ctx.fillStyle = '#9aa3b2'; ctx.textBaseline = 'middle';
    const ax = kind === 'side' ? 1 : 0, lo = kind === 'side' ? -6.2 : -5.6, hi = -lo;
    const P = (h, z) => { const X = [0, 0, z]; X[ax] = h; return proj(X); };

    }

        const a = P(-5.6, 0); ctx.textAlign = 'left'; ctx.fillText('← 近端', a[0], a[1] + 12 * lw);
        const b = P(5.6, 0); ctx.textAlign = 'right'; ctx.fillText('遠端 →', b[0], b[1] + 12 * lw);
    } else {
        tick(-4.5, '左邊線'); tick(4.5, '右邊線');
        tick(-CONFIG.ZONE_SPLIT, '', true); tick(CONFIG.ZONE_SPLIT, '', true);
        ctx.fillStyle = '#6b7385';
        for (const [h, t] of [[-3, '左'], [0, '中'], [3, '右']]) { const q = P(h, 0); ctx.fillText(t, q[0], q[1] + 12 * lw); }
    }
}

        h += `<div class="card"><div class="head row"><b>#${setNumber(sel.set.id)}</b><span class="num">${fmtTime(sel.tVideo)}</span><span class="tag ${m.team}">${TEAM_LABEL[m.team]}</span><b>${esc(m.target)}</b><span class="muted">${DIR_LABEL[m.dir]}</span></div>
            <dl class="kv">
                <dt>最高點</dt><dd>${m.apexZ.toFixed(2)} m（高出網子 ${m.aboveNet >= 0 ? '+' : ''}${m.aboveNet.toFixed(2)}）</dd>
                <dt>飛行時間</dt><dd>${m.flight.toFixed(2)} 秒</dd>
                <dt>起點</dt><dd>離網 ${m.startDistNet.toFixed(2)} m、高 ${m.startA[2].toFixed(2)} m</dd>
                <dt>終點</dt><dd>離網 ${m.distNet.toFixed(2)} m、離邊線 ${(CONFIG.HALF_W - Math.abs(m.endA[0])).toFixed(2)} m、高 ${m.endA[2].toFixed(2)} m</dd>
                <dt>離手速度</dt><dd>${m.speed.toFixed(1)} m/s</dd>
                <dt>擬合誤差</dt><dd>${sel.fit.rms.toFixed(1)} px</dd>
            </dl>
            <div class="row grade">${Object.entries(CONFIG.GRADES).map(([k, g]) => `<button class="g-${k} ${sel.set.grade === k ? 'on' : ''}" data-grade="${k}">${g.label}</button>`).join('')}</div>
            <textarea id="noteBox" placeholder="註解（例如：太貼網、攻擊手沒準備好）">${esc(sel.set.note)}</textarea></div>`;
    }
    if (ds.length) {
        h += '<div class="list">';
        for (const d of ds) {
            const m = d.metrics;
            h += `<div class="item ${d.set.id === S.selId ? 'sel' : ''}" data-pick="${d.set.id}"><div class="head">
                <span class="dot" style="background:${gradeColor(d.set.grade)}"></span><span class="no">#${setNumber(d.set.id)}</span><span class="num">${fmtTime(d.tVideo)}</span>
                <span class="tag ${m.team}">${TEAM_LABEL[m.team]}</span><span>${esc(m.target)}</span>
                <span class="muted num">${m.apexZ.toFixed(1)} m・${m.flight.toFixed(2)} s</span>${d.set.note ? '<span class="muted">📝</span>' : ''}</div></div>`;
        }
        h += '</div>';
    }
    const missing = all.length - all.filter(d => d.metrics).length;
    if (missing) h += `<p class="hint">另有 ${missing} 顆還算不出軌跡（點數不夠或還沒校正）。</p>`;
    const sm = summarize(all);
    for (const team of ['us', 'them']) {
        const rows = CONFIG.TARGETS.filter(tg => sm[team][tg].n);
        if (!rows.length) continue;
        h += `<div><h3>${TEAM_LABEL[team]}統計</h3><table class="stats"><tr><th>目標區</th><th>次數</th><th>平均最高</th><th>平均飛行</th><th>好／普通／待改進</th></tr>
            ${rows.map(tg => { const g = sm[team][tg]; return `<tr><td>${esc(tg)}</td><td class="num">${g.n}</td><td class="num">${g.apex.toFixed(2)} m</td><td class="num">${g.flight.toFixed(2)} s</td><td class="num">${g.grades.good}／${g.grades.ok}／${g.grades.bad}</td></tr>`; }).join('')}</table></div>`;
    }
    return h;
}
function bindViewTab(root) {
    root.querySelectorAll('[data-team]').forEach(b => b.onclick = () => { S.view.team = b.dataset.team; render(); drawAll(); });
    const ov = root.querySelector('#chkOnVideo');
    if (ov) ov.onchange = () => { S.view.onVideo = ov.checked; drawAll(); };
    root.querySelectorAll('[data-pick]').forEach(el => el.onclick = () => selectSet(el.dataset.pick));
    const ds = visibleDerived();
    const idx = ds.findIndex(d => d.set.id === S.selId);
    const on = (sel, fn) => { const el = root.querySelector(sel); if (el) el.onclick = fn; };
    on('[data-act=prev]', () => { if (ds.length) selectSet(ds[idx <= 0 ? ds.length - 1 : idx - 1].set.id); });
    on('[data-act=next]', () => { if (ds.length) selectSet(ds[idx < 0 || idx >= ds.length - 1 ? 0 : idx + 1].set.id); });
    on('[data-act=playSel]', () => selectSet(S.selId, true));
    root.querySelectorAll('[data-grade]').forEach(b => b.onclick = () => {
        const s = S.project.sets.find(x => x.id === S.selId);
        if (!s) return;
        s.grade = s.grade === b.dataset.grade ? null : b.dataset.grade;
        commit();
    });
    const note = root.querySelector('#noteBox');
    if (note) note.onchange = () => { const s = S.project.sets.find(x => x.id === S.selId); if (s) { s.note = note.value; commit(); } };
}

// ------------------------------------------------------------
// 設定、專案選單
// ------------------------------------------------------------
function openSettings() {
    const p = S.project;
    openSheet(`<h2>設定</h2>
        <div class="field"><label for="setFps">影片 fps</label><input type="number" id="setFps" min="1" max="1000" step="1" value="${p.video.fps}">
            <span class="hint">只影響「1 格」按鈕跳多少；軌跡計算用的是影片時間，設錯不會算錯。</span></div>
        <div class="field"><label for="setRpv">影片 1 秒 = 實際幾秒</label><input type="number" id="setRpv" min="0.001" max="10" step="any" value="${p.video.realPerVideo}">
            <span class="hint">一般影片是 1。慢動作才要改，例如 240fps 慢動作用 30fps 播放：0.125。</span></div>
        <div class="field"><label for="setNet">網高</label><select id="setNet">
            <option value="2.43" ${p.settings.netHeight === 2.43 ? 'selected' : ''}>男網 2.43 m</option>
            <option value="2.24" ${p.settings.netHeight === 2.24 ? 'selected' : ''}>女網 2.24 m</option></select></div>
        <div class="field"><label for="setSide">我方在</label><select id="setSide">
            <option value="near" ${p.settings.ourSide === 'near' ? 'selected' : ''}>近端（靠攝影機那一半）</option>
            <option value="far" ${p.settings.ourSide === 'far' ? 'selected' : ''}>遠端</option></select></div>
        <div class="row" style="justify-content:flex-end"><button data-x="no">取消</button><button class="primary" data-x="yes">儲存</button></div>`, box => {
        box.querySelector('[data-x=no]').onclick = closeSheet;
        box.querySelector('[data-x=yes]').onclick = () => {
            const fps = +box.querySelector('#setFps').value, rpv = +box.querySelector('#setRpv').value;
            if (fps > 0) p.video.fps = fps;
            if (rpv > 0) p.video.realPerVideo = rpv;
            const nh = +box.querySelector('#setNet').value;
            const netChanged = nh !== p.settings.netHeight;
            p.settings.netHeight = nh;
            p.settings.ourSide = box.querySelector('#setSide').value === 'far' ? 'far' : 'near';
            closeSheet();
            if (netChanged) recalibrate();
            commit();
        };
    });
}
let jsonMode = null;
function pickJson(mode) { jsonMode = mode; $('#fileJson').value = ''; $('#fileJson').click(); }
$('#fileJson').addEventListener('change', async e => {
    const f = e.target.files[0];
    if (!f) return;
    let obj;
    try { obj = JSON.parse(await f.text()); } catch (err) { toast('這個檔案不是 JSON'); return; }
    if (jsonMode === 'project') {
        const r = migrate(obj);
        if (!r.ok) { toast(r.msg); return; }
        const apply = () => {
            if (S.ready) {
                const meta = S.project.video;
                if (r.project.video.name && r.project.video.name !== meta.name) toast(`注意：這個專案是給「${r.project.video.name}」的`);
                r.project.video = Object.assign(r.project.video, { name: meta.name, size: meta.size, duration: meta.duration, w: meta.w, h: meta.h });
                S.project = r.project; S.draftId = null; S.selId = null; S.calibResult = null;
                if (!S.project.calib.cam) recalibrate();
                commit(); toast(`已開啟專案（${r.project.sets.length} 顆舉球）`);
            } else {
                S.pendingProject = r.project;
                toast(`請開啟影片「${r.project.video.name || '（未記錄檔名）'}」`);
            }
        };
        if (S.project.sets.length || Object.keys(S.project.calib.points).length) askConfirm('開啟專案檔', '目前這支影片的校正與標記會被取代（可以先下載專案檔備份）。', '開啟', apply);
        else apply();
    } else if (jsonMode === 'det') {
        const r = parseDetections(obj);
        if (!r.ok) { toast(r.msg); return; }
        if (r.video.name && r.video.name !== S.project.video.name) toast(`注意：偵測結果是「${r.video.name}」的`);
        S.project.candidates = r.tracks;
        S.tab = 'mark'; S.preview = null;
        commit();
        layoutStage();
        toast(`匯入 ${r.tracks.length} 條自動偵測的軌跡`);
    }
});
$('#btnOpenVideo').onclick = () => { $('#fileVideo').value = ''; $('#fileVideo').click(); };
document.querySelector('[data-act=openVideo]').onclick = () => $('#btnOpenVideo').click();
$('#fileVideo').addEventListener('change', e => openVideoFile(e.target.files[0]));
$('#btnSettings').onclick = openSettings;
$('#btnProject').onclick = e => { e.stopPropagation(); $('#menuProject').hidden = !$('#menuProject').hidden; };
document.addEventListener('click', () => { $('#menuProject').hidden = true; });
$('#menuProject').addEventListener('click', e => {
    const b = e.target.closest('[data-act]');
    if (!b) return;
    $('#menuProject').hidden = true;
    const act = b.dataset.act;
    if (act === 'openProject') pickJson('project');
    if (act === 'importDet') { if (!S.ready) { toast('先開啟影片'); return; } pickJson('det'); }
    if (act === 'saveProject') download(`${baseName()}-setter-track.json`, S.project);
    if (act === 'exportLabels') {
        const L = buildLabels(S.project);
        if (!L.labels.length) { toast('還沒有可以匯出的標註（要先校正並標記舉球）'); return; }
        download(`${baseName()}-labels.json`, L);
        toast(`匯出 ${L.labels.length} 個球的位置`);
    }
    if (act === 'clearProject') askConfirm('清空資料', '這支影片的校正、標記、候選都會刪掉，不能復原。', '清空', () => {
        const meta = S.project.video;
        S.project = newProject(meta); S.draftId = null; S.selId = null; S.calibResult = null;
        commit();
    });
});

// ------------------------------------------------------------
// 分頁、快捷鍵
// ------------------------------------------------------------
document.querySelectorAll('[data-tab]').forEach(b => b.onclick = () => {
    S.tab = b.dataset.tab; S.confirmDel = null;
    if (S.tab !== 'mark') S.preview = null;
    render(); layoutStage();
});
function render() {
    document.querySelectorAll('[data-tab]').forEach(b => b.classList.toggle('on', b.dataset.tab === S.tab));
    const body = $('#tabBody');
    if (S.tab === 'calib') { body.innerHTML = renderCalib(); bindCalib(body); }
    if (S.tab === 'mark') { body.innerHTML = renderMark(); bindMark(body); }
    if (S.tab === 'view') { body.innerHTML = renderViewTab(); bindViewTab(body); renderView3dTools(); }
}
document.addEventListener('keydown', e => {
    const tag = (e.target.tagName || '').toLowerCase();
    if (tag === 'input' || tag === 'textarea' || tag === 'select' || !$('#sheet').hidden) return;
    if (e.key === ' ') { e.preventDefault(); togglePlay(); }
    else if (e.key === 'ArrowLeft') { e.preventDefault(); if (e.shiftKey) { video.pause(); seek(video.currentTime - 1); } else stepFrames(-1); }
    else if (e.key === 'ArrowRight') { e.preventDefault(); if (e.shiftKey) { video.pause(); seek(video.currentTime + 1); } else stepFrames(1); }
    else if (S.tab === 'mark' && S.draftId) {
        if (e.key === 'Enter') { e.preventDefault(); finishDraft(); }
        else if (e.key === 'Backspace') { e.preventDefault(); undoMark(); }
        else if (e.key === 'Escape') { e.preventDefault(); const s = draftSet(); if (s && (s.marks.length <= 1 || s._editing)) cancelDraft(); else toast('要放棄這顆，請按「取消」'); }
    }
});

window.runSelfTests = runSelfTests;
window.__setterTrack = { S, derived, seek }; // 給 tests/ui-check.mjs 用
render();
layoutStage();
</script>
</body>
